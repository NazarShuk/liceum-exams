<!doctype html>
<html lang="uk">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Немає з'єднання - Вступ до ліцею</title>
        <style>
            :root {
                color-scheme: light;
                --page: #f4f4f5;
                --text: #18181b;
                --muted: #52525b;
                --accent: #234a99;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    color-scheme: dark;
                    --page: #121214;
                    --text: #d4d4d8;
                    --muted: #a1a1aa;
                    --accent: #8db0f0;
                }
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                min-height: 100svh;
                display: grid;
                place-items: center;
                padding: 2rem 1rem;
                background: var(--page);
                color: var(--text);
                font-family: system-ui, sans-serif;
                text-align: center;
            }
            main {
                max-width: 26rem;
            }
            h1 {
                margin: 1.5rem 0 0.5rem;
                font-size: 1.75rem;
            }
            p {
                margin: 0 0 1.75rem;
                color: var(--muted);
                line-height: 1.5;
            }
            button {
                padding: 0.75rem 1.5rem;
                border: 0;
                border-radius: 9999px;
                background: var(--accent);
                color: #f4f4f5;
                font: inherit;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <main>
            <img src="/favicon.svg" alt="" width="72" height="76" />
            <h1>Немає з'єднання</h1>
            <p>Перевірте підключення до інтернету та спробуйте ще раз.</p>
            <button type="button" onclick="location.reload()">Спробувати ще раз</button>
        </main>
    </body>
</html>
