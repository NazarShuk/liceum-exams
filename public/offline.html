<!doctype html>
<html lang="uk">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title data-uk="Немає з'єднання - Вступ до ліцею" data-en="No connection - Lyceum Admissions">
            Немає з'єднання - Вступ до ліцею
        </title>
        <style>
            :root {
                color-scheme: light;
                --page: #f4f4f5;
                --text: #18181b;
                --muted: #52525b;
                --accent: #234a99;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    color-scheme: dark;
                    --page: #121214;
                    --text: #d4d4d8;
                    --muted: #a1a1aa;
                    --accent: #8db0f0;
                }
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                min-height: 100svh;
                display: grid;
                place-items: center;
                padding: 2rem 1rem;
                background: var(--page);
                color: var(--text);
                font-family: system-ui, sans-serif;
                text-align: center;
            }
            main {
                max-width: 26rem;
            }
            h1 {
                margin: 1.5rem 0 0.5rem;
                font-size: 1.75rem;
            }
            p {
                margin: 0 0 1.75rem;
                color: var(--muted);
                line-height: 1.5;
            }
            button {
                padding: 0.75rem 1.5rem;
                border: 0;
                border-radius: 9999px;
                background: var(--accent);
                color: #f4f4f5;
                font: inherit;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <main>
            <img src="/favicon.svg" alt="" width="72" height="76" />
            <h1 data-uk="Немає з'єднання" data-en="No connection">Немає з'єднання</h1>
            <p
                data-uk="Перевірте підключення до інтернету та спробуйте ще раз."
                data-en="Check your internet connection and try again."
            >
                Перевірте підключення до інтернету та спробуйте ще раз.
            </p>
            <button type="button" onclick="location.reload()" data-uk="Спробувати ще раз" data-en="Try again">
                Спробувати ще раз
            </button>
        </main>
        <script>
            // The offline fallback is static; prefer an explicit locale cookie, then the browser language.
            const saved = document.cookie.match(/(?:^|;\s*)locale=(uk|en)\b/)?.[1];
            const browser = (navigator.language || "").toLowerCase().startsWith("en") ? "en" : "uk";
            if ((saved || browser) === "en") {
                document.documentElement.lang = "en";
                for (const element of document.querySelectorAll("[data-en]")) {
                    const text = element.getAttribute("data-en");
                    if (!text) continue;
                    if (element.tagName === "TITLE") document.title = text;
                    else element.textContent = text;
                }
            }
        </script>
    </body>
</html>
